name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            command: npx electron-builder --win nsis --x64 --publish always
          - platform: macos
            os: macos-latest
            command: npx electron-builder --mac dmg zip --universal --publish always
          - platform: linux
            os: ubuntu-latest
            command: npx electron-builder --linux AppImage deb rpm pacman --x64 --publish always

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Prepare Windows code signing helper cache
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $cacheRoot = Join-Path $env:LOCALAPPDATA 'electron-builder\Cache\winCodeSign'
          $target = Join-Path $cacheRoot 'winCodeSign-2.6.0'
          if (Test-Path (Join-Path $target 'rcedit-x64.exe')) {
            exit 0
          }

          New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
          $archive = Join-Path $cacheRoot 'winCodeSign-2.6.0.7z'
          $extract = Join-Path $cacheRoot 'winCodeSign-2.6.0-extract'
          Invoke-WebRequest `
            -Uri 'https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z' `
            -OutFile $archive

          if (Test-Path $extract) {
            Remove-Item -LiteralPath $extract -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          $sevenZip = Join-Path $PWD 'node_modules\7zip-bin\win\x64\7za.exe'
          & $sevenZip x -snld -bd $archive "-o$extract"
          $extractExitCode = $LASTEXITCODE
          if (-not (Test-Path (Join-Path $extract 'rcedit-x64.exe'))) {
            exit $extractExitCode
          }

          $darwinLib = Join-Path $extract 'darwin\10.12\lib'
          function Repair-SymlinkPlaceholder($linkPath, $targetPath) {
            $item = Get-Item -LiteralPath $linkPath -ErrorAction SilentlyContinue
            if (($null -eq $item) -or (($null -eq $item.LinkType) -and ($item.Length -eq 0))) {
              Copy-Item -LiteralPath $targetPath -Destination $linkPath -Force
            }
          }

          Repair-SymlinkPlaceholder `
            -linkPath (Join-Path $darwinLib 'libcrypto.dylib') `
            -targetPath (Join-Path $darwinLib 'libcrypto.1.0.0.dylib')
          Repair-SymlinkPlaceholder `
            -linkPath (Join-Path $darwinLib 'libssl.dylib') `
            -targetPath (Join-Path $darwinLib 'libssl.1.0.0.dylib')

          if (Test-Path $target) {
            Remove-Item -LiteralPath $target -Recurse -Force
          }
          Move-Item -LiteralPath $extract -Destination $target

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build:web

      - name: Build and publish desktop artifacts
        run: ${{ matrix.command }}
