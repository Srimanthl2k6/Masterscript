name: Tauri Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-artifacts:
    name: Build unsigned ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            id: windows
            os: windows-latest
            args: --bundles nsis
          - name: macOS universal
            id: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Linux x64
            id: linux
            os: ubuntu-22.04
            args: --bundles appimage,deb,rpm

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux Tauri prerequisites
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget \
            zstd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable 2026-06-22
        with:
          components: rustfmt
          targets: ${{ matrix.id == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify release source
        run: |
          node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) throw new Error('Git tag and package version differ')"
          npm test
          npm run lint
          npm run build:web
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned Tauri bundles
        run: npm run tauri:build -- --config src-tauri/tauri.ci.conf.json ${{ matrix.args }}

      - name: Package Windows release assets
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' |
            Select-Object -First 1
          Copy-Item -LiteralPath $installer.FullName -Destination "release-assets\MasterScript.Setup.$version.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination 'release-assets\MasterScript.Setup.exe'

      - name: Package macOS release assets
        if: matrix.id == 'macos'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APP_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            "release-assets/MasterScript.mac.$VERSION.universal.zip"
          tar -czf release-assets/MasterScript.app.tar.gz \
            -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          cp "$DMG_PATH" "release-assets/MasterScript.mac.$VERSION.universal.dmg"
          cp "$DMG_PATH" release-assets/MasterScript.mac.universal.dmg
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'checksums-*' -print0 |
              sort -z |
              xargs -0 shasum -a 256 > checksums-macos.sha256
          )

      - name: Package Linux release assets
        if: matrix.id == 'linux'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_ROOT="$RUNNER_TEMP/masterscript-pacman"
          mkdir -p release-assets "$PACKAGE_ROOT/usr/bin" "$PACKAGE_ROOT/usr/share/applications"
          install -m755 src-tauri/target/release/masterscript "$PACKAGE_ROOT/usr/bin/masterscript"
          install -Dm644 src-tauri/icons/128x128.png \
            "$PACKAGE_ROOT/usr/share/icons/hicolor/128x128/apps/masterscript.png"
          cat > "$PACKAGE_ROOT/usr/share/applications/masterscript.desktop" <<EOF
          [Desktop Entry]
          Name=MasterScript
          Comment=Desktop screenwriting suite
          Exec=masterscript
          Icon=masterscript
          Terminal=false
          Type=Application
          Categories=Office;
          EOF
          cat > "$PACKAGE_ROOT/.PKGINFO" <<EOF
          pkgname = masterscript
          pkgbase = masterscript
          pkgver = $VERSION-1
          pkgdesc = Desktop screenwriting suite
          url = https://github.com/Srimanthl2k6/Masterscript
          builddate = $(date +%s)
          packager = MasterScript
          size = $(stat -c%s "$PACKAGE_ROOT/usr/bin/masterscript")
          arch = x86_64
          license = custom
          depend = webkit2gtk-4.1
          EOF
          tar --zstd -cf "release-assets/MasterScript.linux.$VERSION.x86_64.pkg.tar.zst" \
            -C "$PACKAGE_ROOT" .
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          RPM="$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$APPIMAGE"
          test -n "$DEB"
          test -n "$RPM"
          cp "$APPIMAGE" "release-assets/MasterScript.linux.$VERSION.x86_64.AppImage"
          cp "$APPIMAGE" release-assets/MasterScript.linux.x86_64.AppImage
          cp "$DEB" "release-assets/MasterScript.linux.$VERSION.amd64.deb"
          cp "$RPM" "release-assets/MasterScript.linux.$VERSION.x86_64.rpm"
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'checksums-*' -print0 |
              sort -z |
              xargs -0 sha256sum > checksums-linux.sha256
          )

      - name: Run Windows RAM and installed-footprint release gates
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          $executable = (Resolve-Path 'src-tauri\target\release\masterscript.exe').Path
          $installer = (Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' | Select-Object -First 1).FullName
          npm run benchmark:tauri -- "--executable=$executable" "--installer=$installer"

      - name: Copy Windows performance evidence
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          Copy-Item analysis\tauri-pass8\tauri-runtime-result.json release-assets\
          Get-ChildItem release-assets -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash *$($_.Name)"
            } |
            Set-Content -LiteralPath 'release-assets\checksums-windows.sha256'

      - name: Upload unsigned release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ matrix.id }}
          path: release-assets/
          if-no-files-found: error

  release-signing:
    name: Verify and sign updater artifacts
    runs-on: ubuntu-latest
    needs: build-artifacts
    environment: release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download unsigned build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unsigned-release-*
          path: unsigned-assets
          merge-multiple: true

      - name: Verify recorded build digests
        working-directory: unsigned-assets
        run: cat checksums-*.sha256 | sha256sum --check --strict

      - name: Download checksum-pinned Tauri signer
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output cargo-tauri.tgz \
            https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.3/cargo-tauri-x86_64-unknown-linux-gnu.tgz
          echo '56ebe242d3cab6747dea41b47cdabace47fbea86d65c796f34a95d620d3bad1d *cargo-tauri.tgz' |
            sha256sum --check --strict
          mkdir signer
          tar -xzf cargo-tauri.tgz -C signer cargo-tauri
          chmod 0755 signer/cargo-tauri
          test "$(signer/cargo-tauri --version)" = 'tauri-cli 2.11.3'

      - name: Sign updater payloads
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          signer/cargo-tauri signer sign "unsigned-assets/MasterScript.Setup.$VERSION.exe"
          signer/cargo-tauri signer sign unsigned-assets/MasterScript.app.tar.gz
          signer/cargo-tauri signer sign "unsigned-assets/MasterScript.linux.$VERSION.x86_64.AppImage"

      - name: Assemble signed updater metadata
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          mkdir signed-assets
          cp unsigned-assets/MasterScript* signed-assets/
          cp unsigned-assets/tauri-runtime-result.json signed-assets/
          cp "unsigned-assets/MasterScript.Setup.$VERSION.exe.sig" signed-assets/MasterScript.Setup.exe.sig
          cp "unsigned-assets/MasterScript.linux.$VERSION.x86_64.AppImage.sig" \
            signed-assets/MasterScript.linux.x86_64.AppImage.sig

          WIN_SIGNATURE="$(cat "unsigned-assets/MasterScript.Setup.$VERSION.exe.sig")"
          MAC_SIGNATURE="$(cat unsigned-assets/MasterScript.app.tar.gz.sig)"
          LINUX_SIGNATURE="$(cat "unsigned-assets/MasterScript.linux.$VERSION.x86_64.AppImage.sig")"
          BASE_URL="https://github.com/$REPOSITORY/releases/download/$TAG"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n \
            --arg version "$VERSION" \
            --arg pubDate "$PUB_DATE" \
            --arg winSignature "$WIN_SIGNATURE" \
            --arg macSignature "$MAC_SIGNATURE" \
            --arg linuxSignature "$LINUX_SIGNATURE" \
            --arg baseUrl "$BASE_URL" \
            '{
              version: $version,
              notes: "MasterScript 0.6.4 scrolls Find/Replace matches into view and highlights them without focusing the editor.",
              pub_date: $pubDate,
              platforms: {
                "windows-x86_64": {
                  signature: $winSignature,
                  url: ($baseUrl + "/MasterScript.Setup.exe")
                },
                "linux-x86_64": {
                  signature: $linuxSignature,
                  url: ($baseUrl + "/MasterScript.linux.x86_64.AppImage")
                },
                "darwin-x86_64": {
                  signature: $macSignature,
                  url: ($baseUrl + "/MasterScript.app.tar.gz")
                },
                "darwin-aarch64": {
                  signature: $macSignature,
                  url: ($baseUrl + "/MasterScript.app.tar.gz")
                }
              }
            }' > signed-assets/latest.json

          WIN_FILE="MasterScript.Setup.$VERSION.exe"
          WIN_SHA512="$(openssl dgst -sha512 -binary "signed-assets/$WIN_FILE" | base64 -w0)"
          WIN_SIZE="$(stat -c%s "signed-assets/$WIN_FILE")"
          cat > signed-assets/latest.yml <<EOF
          version: $VERSION
          files:
            - url: $WIN_FILE
              sha512: $WIN_SHA512
              size: $WIN_SIZE
          path: $WIN_FILE
          sha512: $WIN_SHA512
          releaseDate: '$PUB_DATE'
          EOF

          MAC_FILE="MasterScript.mac.$VERSION.universal.zip"
          MAC_SHA512="$(openssl dgst -sha512 -binary "signed-assets/$MAC_FILE" | base64 -w0)"
          MAC_SIZE="$(stat -c%s "signed-assets/$MAC_FILE")"
          cat > signed-assets/latest-mac.yml <<EOF
          version: $VERSION
          files:
            - url: $MAC_FILE
              sha512: $MAC_SHA512
              size: $MAC_SIZE
          path: $MAC_FILE
          sha512: $MAC_SHA512
          releaseDate: '$PUB_DATE'
          EOF

          LINUX_FILE="MasterScript.linux.$VERSION.x86_64.AppImage"
          LINUX_SHA512="$(openssl dgst -sha512 -binary "signed-assets/$LINUX_FILE" | base64 -w0)"
          LINUX_SIZE="$(stat -c%s "signed-assets/$LINUX_FILE")"
          cat > signed-assets/latest-linux.yml <<EOF
          version: $VERSION
          files:
            - url: $LINUX_FILE
              sha512: $LINUX_SHA512
              size: $LINUX_SIZE
          path: $LINUX_FILE
          sha512: $LINUX_SHA512
          releaseDate: '$PUB_DATE'
          EOF

          (
            cd signed-assets
            find . -maxdepth 1 -type f ! -name release-checksums.sha256 -print0 |
              sort -z |
              xargs -0 sha256sum > release-checksums.sha256
          )

      - name: Attest signed release provenance
        uses: actions/attest-build-provenance@b3e506e8c389afc651c5bacf2b8f2a1ea0557215 # v4.1.0
        with:
          subject-path: signed-assets/*

      - name: Upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: signed-assets/
          if-no-files-found: error

  publish-release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    needs: release-signing
    permissions:
      contents: write

    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: signed-assets

      - name: Verify signed release digests
        working-directory: signed-assets
        run: sha256sum --check --strict release-checksums.sha256

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --draft \
            --title "MasterScript $TAG" \
            --notes "MasterScript 0.6.4 scrolls Find/Replace matches into view and highlights them without focusing the editor."

      - name: Upload signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" signed-assets/* --repo "$REPOSITORY"

      - name: Verify required release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSETS="$(gh release view "$TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name')"
          for required in \
            latest.json \
            latest.yml \
            latest-mac.yml \
            latest-linux.yml \
            "MasterScript.Setup.${TAG#v}.exe" \
            MasterScript.Setup.exe \
            "MasterScript.mac.${TAG#v}.universal.dmg" \
            MasterScript.mac.universal.dmg \
            "MasterScript.mac.${TAG#v}.universal.zip" \
            MasterScript.app.tar.gz \
            "MasterScript.linux.${TAG#v}.x86_64.AppImage" \
            MasterScript.linux.x86_64.AppImage \
            "MasterScript.linux.${TAG#v}.amd64.deb" \
            "MasterScript.linux.${TAG#v}.x86_64.rpm" \
            "MasterScript.linux.${TAG#v}.x86_64.pkg.tar.zst" \
            release-checksums.sha256
          do
            echo "$ASSETS" | grep -Fx "$required"
          done

      - name: Publish verified Tauri release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$REPOSITORY" --draft=false
