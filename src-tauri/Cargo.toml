[package]
name = "masterscript"
version = "0.1.14"
description = "MasterScript Tauri 2 compatibility shell"
authors = ["Srimanthl2k6"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "masterscript_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = [] }
