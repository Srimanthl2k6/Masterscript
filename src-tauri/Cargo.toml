[package]
name = "masterscript"
version = "0.1.14"
description = "MasterScript Tauri 2 compatibility shell"
authors = ["Srimanthl2k6"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "masterscript_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.32"
local-ip-address = "0.6.13"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = [] }
tempfile = "3.27.0"
tokio = { version = "1.52.0", features = ["fs", "macros", "net", "rt-multi-thread", "sync"] }
tokio-tungstenite = "0.29.0"
url = "2.5.8"
urlencoding = "2.1.3"
